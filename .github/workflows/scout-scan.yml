name: Scout Agent - Signal Scan

on:
  # Run every 6 hours
  schedule:
    - cron: '0 */6 * * *'
  # Manual trigger for breaking news
  workflow_dispatch:
    inputs:
      priority_override:
        description: 'Force priority level (urgent/high/normal)'
        required: false
        default: ''
      focus_topic:
        description: 'Optional topic to focus scan on'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  SCOUT_CONFIG: agents/scout/config.md
  BRIEFS_DIR: handoffs/scout-to-content/briefs
  CRISIS_DIR: handoffs/scout-to-governance

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install anthropic requests

      - name: Run Scout scan
        id: scout
        run: |
          python scripts/scout-scan.py \
            --config "$SCOUT_CONFIG" \
            --output-dir "$BRIEFS_DIR" \
            --priority-override "$PRIORITY_OVERRIDE" \
            --focus-topic "$FOCUS_TOPIC"
        env:
          DEFILLAMA_API: https://api.llama.fi
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          PRIORITY_OVERRIDE: ${{ github.event.inputs.priority_override }}
          FOCUS_TOPIC: ${{ github.event.inputs.focus_topic }}

      - name: Check for new briefs
        id: check_briefs
        run: |
          BRIEFS=$(git diff --name-only -- "$BRIEFS_DIR/*.md" 2>/dev/null | wc -l)
          NEW_BRIEFS=$(git ls-files --others --exclude-standard -- "$BRIEFS_DIR/*.md" 2>/dev/null | wc -l)
          TOTAL=$((BRIEFS + NEW_BRIEFS))
          echo "brief_count=$TOTAL" >> $GITHUB_OUTPUT
          echo "Found $TOTAL new/modified briefs"

      - name: Check for crisis escalations
        id: check_crisis
        run: |
          CRISIS=$(git ls-files --others --exclude-standard -- "$CRISIS_DIR/*.md" 2>/dev/null | wc -l)
          echo "crisis_count=$CRISIS" >> $GITHUB_OUTPUT
          if [ "$CRISIS" -gt 0 ]; then
            echo "CRISIS DETECTED - routing to Governance"
          fi

      - name: Commit briefs
        if: steps.check_briefs.outputs.brief_count > 0
        run: |
          git config user.name "BotDAO Scout Agent"
          git config user.email "scout@botdao.ai"
          git add "$BRIEFS_DIR/" "$CRISIS_DIR/" state/ logs/ data/
          git commit -m "scout: $(date -u +%Y-%m-%dT%H%M)Z scan - ${{ steps.check_briefs.outputs.brief_count }} brief(s) generated"
          git push

      - name: Update agent health
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "scout: $TIMESTAMP" >> state/agent-health.md

      - name: Create GitHub Issue for urgent briefs
        if: steps.check_briefs.outputs.brief_count > 0
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const briefsDir = process.env.BRIEFS_DIR;
            const files = fs.readdirSync(briefsDir).filter(f => f.endsWith('.md'));

            for (const file of files) {
              const content = fs.readFileSync(path.join(briefsDir, file), 'utf8');
              const priorityMatch = content.match(/priority:\s*(urgent|high|normal)/);
              const priority = priorityMatch ? priorityMatch[1] : 'normal';

              // Only create issues for urgent/high priority
              if (priority === 'urgent' || priority === 'high') {
                const summaryMatch = content.match(/# Signal Summary\n\n(.*?)(\n\n|\n##)/s);
                const summary = summaryMatch ? summaryMatch[1].slice(0, 200) : 'New signal detected';

                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `[Scout ${priority.toUpperCase()}] ${file.replace('.md', '')}`,
                  body: `## Scout Brief\n\n${summary}...\n\nFull brief: \`${briefsDir}/${file}\`\n\nThis issue was auto-created by the Scout Agent. Content Agent will pick this up on next cycle.`,
                  labels: ['scout-brief', `priority-${priority}`, 'awaiting-content']
                });
              }
            }

      - name: Create crisis issue
        if: steps.check_crisis.outputs.crisis_count > 0
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[CRISIS] Scout detected urgent escalation',
              body: 'Crisis escalation detected. Check `handoffs/scout-to-governance/` for details. Content pipeline is PAUSED until Governance reviews.',
              labels: ['crisis', 'governance-review', 'priority-urgent']
            });
